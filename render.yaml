services:
  - type: web
    name: diwaanka-ajaanibka
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r backend-api/requirements.txt
    startCommand: cd backend-api && uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        value: Ridwan
      - key: ADMIN_PASSWORD
        sync: false
      - key: OFFICER_USERNAME
        value: officer
      - key: OFFICER_PASSWORD
        sync: false
