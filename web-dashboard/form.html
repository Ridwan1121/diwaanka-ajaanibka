<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diiwaangelinta Ajaanibta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        body { background: #0a0e1a; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; color: #fff; }
        .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; }
        .input-field { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 14px 16px; border-radius: 12px; width: 100%; }
        .input-field:focus { outline: none; border-color: #3b82f6; background: rgba(59,130,246,0.1); }
        .btn-primary { background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%); color: white; padding: 14px; border-radius: 12px; font-weight: 600; width: 100%; border: none; cursor: pointer; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(59,130,246,0.3); }
        .error-message { background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.3); color: #ef4444; padding: 12px; border-radius: 8px; }
        .success-message { background: rgba(34,197,94,0.2); border: 1px solid rgba(34,197,94,0.3); color: #22c55e; padding: 12px; border-radius: 8px; }
    </style>
</head>
<body>
<div class="flex">
    <aside class="w-64 flex-shrink-0 hidden lg:block" style="background: rgba(10,14,26,0.95); border-right: 1px solid rgba(255,255,255,0.06); min-height: 100vh; position: sticky; top: 0;">
        <div class="p-6 border-b border-white/5">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-500/20 flex items-center justify-center">
                    <i class="fas fa-id-card text-blue-400 text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white">Diwaanka</h1>
                    <p class="text-xs text-gray-500">Ajaanibka System</p>
                </div>
            </div>
        </div>
        <nav class="p-4 space-y-1">
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-blue-500/10 hover:text-white transition"><i class="fas fa-chart-pie"></i> Dashboard</a>
            <a href="form.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-500/15 text-blue-400 border border-blue-500/20"><i class="fas fa-user-plus"></i> Diiwaangeli</a>
            <a href="edit.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-blue-500/10 hover:text-white transition"><i class="fas fa-edit"></i> Edit/Delete</a>
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-blue-500/10 hover:text-white transition"><i class="fas fa-camera"></i> Weji-Aqoonsi</a>
        </nav>
    </aside>

    <main class="flex-1 p-4 lg:p-8">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h2 class="text-2xl font-bold text-white">Diiwaangelinta Ajaanibta</h2>
                <p class="text-gray-400 text-sm">Ku dar ajaanib cusub nidaamka</p>
            </div>
            <a href="index.html" class="flex items-center gap-2 bg-white/5 rounded-full px-4 py-2 border border-white/5 text-gray-300 hover:bg-white/10 transition">
                <i class="fas fa-arrow-left"></i> Ku noqo
            </a>
        </div>

        <div class="glass p-6 lg:p-8 max-w-4xl">
            <div id="errorMessage" class="error-message hidden mb-4"></div>
            <div id="successMessage" class="success-message hidden mb-4"></div>

            <form id="immigrantForm" onsubmit="handleSubmit(event)">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Magaca Buuxa *</label>
                        <input type="text" id="name" class="input-field" placeholder="Ahmed Ali" required />
                    </div>
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Dalka *</label>
                        <input type="text" id="country" class="input-field" placeholder="Somalia" required />
                    </div>
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Gobolka *</label>
                        <input type="text" id="region" class="input-field" placeholder="Banadir" required />
                    </div>
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Xudduudda Laga Soo Galay *</label>
                        <input type="text" id="entry_point" class="input-field" placeholder="Aden Adde" required />
                    </div>
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Degmada *</label>
                        <input type="text" id="district" class="input-field" placeholder="Hodan" required />
                    </div>
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Baasaboorka</label>
                        <input type="text" id="passport" class="input-field" placeholder="A1234567" />
                    </div>
                </div>
                <div class="mt-6 flex gap-3">
                    <button type="submit" class="btn-primary flex-1">
                        <i class="fas fa-save mr-2"></i> Diiwaangeli
                    </button>
                    <button type="button" onclick="resetForm()" class="flex-1 bg-white/5 text-gray-300 py-3 rounded-xl font-semibold border border-white/10 hover:bg-white/10 transition">
                        <i class="fas fa-redo mr-2"></i> Nadiifi
                    </button>
                </div>
            </form>
        </div>
    </main>
</div>

<script>
    const API_URL = 'http://127.0.0.1:8000';
    const token = localStorage.getItem('access_token');

    if (!token) window.location.href = 'login.html';

    async function handleSubmit(event) {
        event.preventDefault();
        const errorDiv = document.getElementById('errorMessage');
        const successDiv = document.getElementById('successMessage');
        errorDiv.classList.add('hidden');
        successDiv.classList.add('hidden');

        const data = {
            name: document.getElementById('name').value,
            country: document.getElementById('country').value,
            region: document.getElementById('region').value,
            entry_point: document.getElementById('entry_point').value,
            district: document.getElementById('district').value,
            passport: document.getElementById('passport').value || null,
            status: 'registered'
        };

        try {
            const response = await fetch(`${API_URL}/immigrants/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(data)
            });

            if (!response.ok) throw new Error('Qalad dhacay');

            successDiv.textContent = '✅ Ajaanib cusub waa la diiwaangeliyay!';
            successDiv.classList.remove('hidden');
            resetForm();

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2000);
        } catch (error) {
            errorDiv.textContent = '❌ Qalad: ' + error.message;
            errorDiv.classList.remove('hidden');
        }
    }

    function resetForm() {
        document.getElementById('immigrantForm').reset();
    }
</script>
</body>
</html>
