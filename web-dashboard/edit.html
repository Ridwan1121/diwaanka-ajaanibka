<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit/Delete Ajaanibta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        body { background: #0a0e1a; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; color: #fff; }
        .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; }
        .input-field { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 14px 16px; border-radius: 12px; width: 100%; }
        .input-field:focus { outline: none; border-color: #3b82f6; }
        .btn-primary { background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%); color: white; padding: 14px; border-radius: 12px; font-weight: 600; width: 100%; border: none; cursor: pointer; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(59,130,246,0.3); }
        .table-row { border-bottom: 1px solid rgba(255,255,255,0.05); }
        .table-row:hover { background: rgba(255,255,255,0.03); }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge-success { background: rgba(34,197,94,0.2); color: #22c55e; }
        .error-message { background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.3); color: #ef4444; padding: 12px; border-radius: 8px; }
        .success-message { background: rgba(34,197,94,0.2); border: 1px solid rgba(34,197,94,0.3); color: #22c55e; padding: 12px; border-radius: 8px; }
    </style>
</head>
<body>
<div class="flex">
    <aside class="w-64 flex-shrink-0 hidden lg:block" style="background: rgba(10,14,26,0.95); border-right: 1px solid rgba(255,255,255,0.06); min-height: 100vh; position: sticky; top: 0;">
        <div class="p-6 border-b border-white/5">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-500/20 flex items-center justify-center">
                    <i class="fas fa-id-card text-blue-400 text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white">Diwaanka</h1>
                    <p class="text-xs text-gray-500">Ajaanibka System</p>
                </div>
            </div>
        </div>
        <nav class="p-4 space-y-1">
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-blue-500/10 hover:text-white transition"><i class="fas fa-chart-pie"></i> Dashboard</a>
            <a href="form.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-blue-500/10 hover:text-white transition"><i class="fas fa-user-plus"></i> Diiwaangeli</a>
            <a href="edit.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-500/15 text-blue-400 border border-blue-500/20"><i class="fas fa-edit"></i> Edit/Delete</a>
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-blue-500/10 hover:text-white transition"><i class="fas fa-camera"></i> Weji-Aqoonsi</a>
        </nav>
    </aside>

    <main class="flex-1 p-4 lg:p-8">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h2 class="text-2xl font-bold text-white">Edit/Delete Ajaanibta</h2>
                <p class="text-gray-400 text-sm">Cusbooneysii ama tirtir ajaanibta</p>
            </div>
            <a href="index.html" class="flex items-center gap-2 bg-white/5 rounded-full px-4 py-2 border border-white/5 text-gray-300 hover:bg-white/10 transition">
                <i class="fas fa-arrow-left"></i> Ku noqo
            </a>
        </div>

        <div id="errorMessage" class="error-message hidden mb-4"></div>
        <div id="successMessage" class="success-message hidden mb-4"></div>

        <div class="glass p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold text-white">Liiska Ajaanibta</h3>
                <button onclick="loadImmigrants()" class="flex items-center gap-2 bg-blue-500/20 text-blue-400 px-4 py-2 rounded-xl hover:bg-blue-500/30 transition">
                    <i class="fas fa-sync"></i> Cusbooneysii
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="border-b border-white/10">
                        <tr>
                            <th class="pb-3 text-gray-400 text-sm">ID</th>
                            <th class="pb-3 text-gray-400 text-sm">Magac</th>
                            <th class="pb-3 text-gray-400 text-sm">Dalka</th>
                            <th class="pb-3 text-gray-400 text-sm">Gobolka</th>
                            <th class="pb-3 text-gray-400 text-sm">Xudduudda</th>
                            <th class="pb-3 text-gray-400 text-sm">Degmada</th>
                            <th class="pb-3 text-gray-400 text-sm">Status</th>
                            <th class="pb-3 text-gray-400 text-sm">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="immigrantsTable">
                        <tr><td colspan="8" class="text-center py-8 text-gray-500">Fadlan sug...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- EDIT MODAL -->
<div id="editModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="glass p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-semibold text-white">Edit Ajaanib</h3>
            <button onclick="closeEditModal()" class="text-gray-400 hover:text-white"><i class="fas fa-times"></i></button>
        </div>
        <form id="editForm" onsubmit="handleEditSubmit(event)">
            <input type="hidden" id="editId" />
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="block text-gray-400 text-sm mb-2">Magaca *</label><input type="text" id="editName" class="input-field" required /></div>
                <div><label class="block text-gray-400 text-sm mb-2">Dalka *</label><input type="text" id="editCountry" class="input-field" required /></div>
                <div><label class="block text-gray-400 text-sm mb-2">Gobolka *</label><input type="text" id="editRegion" class="input-field" required /></div>
                <div><label class="block text-gray-400 text-sm mb-2">Xudduudda *</label><input type="text" id="editEntryPoint" class="input-field" required /></div>
                <div><label class="block text-gray-400 text-sm mb-2">Degmada *</label><input type="text" id="editDistrict" class="input-field" required /></div>
                <div><label class="block text-gray-400 text-sm mb-2">Baasaboorka</label><input type="text" id="editPassport" class="input-field" /></div>
            </div>
            <div class="mt-6 flex gap-3">
                <button type="submit" class="btn-primary flex-1"><i class="fas fa-save mr-2"></i> Cusbooneysii</button>
                <button type="button" onclick="closeEditModal()" class="flex-1 bg-white/5 text-gray-300 py-3 rounded-xl font-semibold border border-white/10 hover:bg-white/10 transition">Jooji</button>
            </div>
        </form>
    </div>
</div>

<script>
    const API_URL = 'http://127.0.0.1:8000';
    const token = localStorage.getItem('access_token');

    if (!token) window.location.href = 'login.html';

    async function loadImmigrants() {
        try {
            const response = await fetch(`${API_URL}/immigrants/`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!response.ok) throw new Error('Qalad dhacay');
            const data = await response.json();
            const table = document.getElementById('immigrantsTable');

            if (data.immigrants && data.immigrants.length > 0) {
                table.innerHTML = data.immigrants.map(i => `
                    <tr class="table-row">
                        <td class="py-3 text-gray-400">${i.id}</td>
                        <td class="py-3 text-white">${i.name}</td>
                        <td class="py-3 text-gray-300">${i.country}</td>
                        <td class="py-3 text-gray-300">${i.region}</td>
                        <td class="py-3 text-gray-300">${i.entry_point}</td>
                        <td class="py-3 text-gray-300">${i.district}</td>
                        <td class="py-3"><span class="badge badge-success">${i.status}</span></td>
                        <td class="py-3">
                            <button onclick="openEditModal(${i.id}, '${i.name}', '${i.country}', '${i.region}', '${i.entry_point}', '${i.district}', '${i.passport || ''}')" class="text-blue-400 hover:text-blue-300 mr-3"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteImmigrant(${i.id}, '${i.name}')" class="text-red-400 hover:text-red-300"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `).join('');
            } else {
                table.innerHTML = '<tr><td colspan="8" class="text-center py-8 text-gray-500">Ma jiro ajaanib</td></tr>';
            }
        } catch (error) {
            showError('Qalad: ' + error.message);
        }
    }

    function openEditModal(id, name, country, region, entryPoint, district, passport) {
        document.getElementById('editId').value = id;
        document.getElementById('editName').value = name;
        document.getElementById('editCountry').value = country;
        document.getElementById('editRegion').value = region;
        document.getElementById('editEntryPoint').value = entryPoint;
        document.getElementById('editDistrict').value = district;
        document.getElementById('editPassport').value = passport;
        document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
        document.getElementById('editModal').classList.add('hidden');
    }

    async function handleEditSubmit(event) {
        event.preventDefault();
        const id = document.getElementById('editId').value;
        const data = {
            name: document.getElementById('editName').value,
            country: document.getElementById('editCountry').value,
            region: document.getElementById('editRegion').value,
            entry_point: document.getElementById('editEntryPoint').value,
            district: document.getElementById('editDistrict').value,
            passport: document.getElementById('editPassport').value || null,
            status: 'registered'
        };

        try {
            const response = await fetch(`${API_URL}/immigrants/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(data)
            });
            if (!response.ok) throw new Error('Qalad dhacay');
            showSuccess('✅ Ajaanib waa la cusbooneysiiyay!');
            closeEditModal();
            loadImmigrants();
        } catch (error) {
            showError('❌ Qalad: ' + error.message);
        }
    }

    async function deleteImmigrant(id, name) {
        if (!confirm(`Ma hubtaa inaad tirtirto "${name}"?`)) return;
        try {
            const response = await fetch(`${API_URL}/immigrants/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!response.ok) throw new Error('Qalad dhacay');
            showSuccess('✅ Ajaanib waa la tirtiray!');
            loadImmigrants();
        } catch (error) {
            showError('❌ Qalad: ' + error.message);
        }
    }

    function showError(msg) {
        const div = document.getElementById('errorMessage');
        div.textContent = msg;
        div.classList.remove('hidden');
        setTimeout(() => div.classList.add('hidden'), 5000);
    }

    function showSuccess(msg) {
        const div = document.getElementById('successMessage');
        div.textContent = msg;
        div.classList.remove('hidden');
        setTimeout(() => div.classList.add('hidden'), 5000);
    }

    loadImmigrants();
</script>
</body>
</html>
